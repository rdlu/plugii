# plugii's docs site: https://plugii.dlu.one/, served by GitHub Pages with a
# custom domain (static/CNAME). Links still go through relURL, so the site
# also works under a subpath like rdlu.github.io/plugii/ if the domain goes.
baseURL = "https://plugii.dlu.one/"
title = "plugii"
locale = "en"
# Hextra v0.13.0, vendored (trimmed) into themes/hextra: no Go modules, no Node.
theme = "hextra"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[outputs]
  home = ["html"]
  section = ["html"]
  page = ["html"]

[markup.goldmark.renderer]
  unsafe = true # <kbd>, <video> and small layout wrappers in Markdown
[markup.highlight]
  noClasses = false
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[[menu.main]]
  name = "Docs"
  pageRef = "/docs"
  weight = 1
[[menu.main]]
  name = "Search"
  weight = 2
  [menu.main.params]
    type = "search"
[[menu.main]]
  name = "Theme"
  weight = 3
  [menu.main.params]
    type = "theme-toggle"
[[menu.main]]
  name = "GitHub"
  url = "https://github.com/rdlu/plugii"
  weight = 4
  [menu.main.params]
    icon = "github"

[params]
  description = "A live USB port monitor for Linux: which socket, what link speed, USB-C / PD power, a health verdict, and a vim-key TUI."
  displayUpdatedDate = false

  [params.navbar]
    displayTitle = true
    displayLogo = true
    width = "wide"
    [params.navbar.logo]
      path = "favicon.svg"
      dark = "favicon.svg"
      width = 26
      height = 26

  [params.theme]
    default = "dark"
    displayToggle = true

  # The footer's `whoami` block (layouts/_partials/custom/footer.html).
  [params.author]
    name = "Rodrigo Dlugokenski"
    location = "Rio de Janeiro / Porto Alegre, Brazil"
    since = 2026
    [[params.author.links]]
      label = "r.dlu.one"
      url = "https://r.dlu.one"
    [[params.author.links]]
      label = "github.com/rdlu"
      url = "https://github.com/rdlu"
    [[params.author.links]]
      label = "bsky @r.dlu.one"
      url = "https://bsky.app/profile/r.dlu.one"
    [[params.author.links]]
      label = "programming.dev/u/rdlu"
      url = "https://programming.dev/u/rdlu"

  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = true

  [params.page]
    width = "wide" # room for 100-column reports and TUI screens
    [params.page.tabs]
      sync = true # the install method (binary / mise / source) is remembered across pages

  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"
      tokenize = "forward"
      # Vendored (assets/lib/flexsearch, Apache-2.0), so the build needs no
      # network: without this Hextra fetches it from jsDelivr.
      js = "lib/flexsearch/flexsearch.bundle.min.js"

  [params.highlight.copy]
    enable = true
    display = "hover"

  [params.editURL]
    enable = false

# Source-of-truth files from the crate, mounted into assets/ so templates
# read them on every build: no copies, no generator. Declaring an assets
# mount replaces the default one, so assets/ itself is mounted first.
[[module.mounts]]
  source = "assets"
  target = "assets"
# The TUI keymap: the `keymap` shortcode parses BINDINGS and PROMPT_KEYS.
[[module.mounts]]
  source = "../src/tui"
  target = "assets/plugii"
  files = ["keys.rs"]
# insta snapshots, which `cargo test` checks: real reports, TUI screens and
# the CLI's --help text, shown by the `snapshot` shortcode.
[[module.mounts]]
  source = "../tests/snapshots"
  target = "assets/snapshots"
  files = ["report__*.snap", "tui__*.snap", "cli__help_*.snap"]
# Demo videos and their posters, made by `mise run demos` (site/demos/build.sh).
[[module.mounts]]
  source = "demos"
  target = "assets/demos"
  files = ["*.webm", "*.png"]
# ...and the recording they play, for download.
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "demos"
  target = "static/demos"
  files = ["*.jsonl.gz"]
