[tools]
"cargo:cargo-insta" = "latest"
# The docs site (site/): plain hugo, since Hextra ships precompiled CSS.
hugo = "0.168.0"

[tasks.fmt]
description = "Format the code"
run = "cargo fmt"

[tasks.lint]
description = "Clippy with warnings as errors"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Run the test suite"
run = "cargo test"

[tasks.check]
description = "The commit gates: fmt --check, clippy, test"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo test",
]

[tasks.test-live]
description = "Smoke tests against this machine's real sysfs"
run = "cargo test --test live -- --ignored --nocapture"

[tasks.review]
description = "Review pending insta snapshots"
run = "cargo insta review"

[tasks.report]
description = "Full report on this machine"
run = "cargo run -q --"

[tasks.health]
description = "Health verdict only"
run = "cargo run -q -- -H"

[tasks.watch]
description = "The live TUI"
run = "cargo run -q -- watch"

[tasks.install]
description = "Install the plugii binary into ~/.cargo/bin from this checkout"
run = "cargo install --locked --path ."

[tasks.capture]
description = "Capture this machine's sysfs as a fixture (review the redaction before committing)"
usage = 'arg "<name>" help="fixture name, e.g. daisy-dock"'
run = 'cargo run -q -- capture "tests/fixtures/sysfs/${usage_name?}"'

[tasks.outdated]
description = "Dependencies with newer versions, including major ones"
run = "cargo update --dry-run --verbose 2>&1 | grep -E 'Updating [^ ]+ v|Unchanged.*available' || echo 'all dependencies up to date'"

[tasks.update]
description = "Update Cargo.lock within semver, then run the gates"
run = ["cargo update", { task = "check" }]

[tasks.push]
description = "Run the gates and push the current branch to GitHub, for a PR (retries for the security key)"
run = '''
set -e
branch=$(git branch --show-current)
case "$branch" in
  main|"") echo "on ${branch:-a detached HEAD}: work on a feat/, fix/, docs/ or chore/ branch"; exit 1 ;;
esac
[ -z "$(git status --porcelain)" ] || { echo "working tree not clean"; exit 1; }
mise run check
for i in 1 2 3; do
  git push -u origin "$branch" && exit 0
  echo "push failed (touch the security key?), retry $i/3"
done
exit 1
'''

[tasks.docs]
description = "Docs site dev server on http://127.0.0.1:1313/ (live reload)"
dir = "site"
run = "hugo server --bind 127.0.0.1 --port 1313"

[tasks.docs-build]
description = "Minified docs site build into site/public/"
dir = "site"
run = "hugo --minify --cleanDestinationDir"

[tasks.demos]
description = "Regenerate the docs site demos: recording, VHS videos, posters (needs vhs, ffmpeg)"
run = "site/demos/build.sh"

# Releases: docs/RELEASE.md is the checklist these serve.

[tasks.changelog]
description = "Draft CHANGELOG.md's section for Cargo.toml's version from the commits since the last tag (git-cliff)"
run = '''
version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
.github/scripts/changelog-draft.sh "$version"
'''

[tasks.release-check]
description = "Release dry runs: version and CHANGELOG, crate contents, cargo publish --dry-run, PKGBUILDs"
run = '''
set -euo pipefail
version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
echo "== plugii $version"
.github/scripts/changelog-section.sh "$version" >/dev/null
echo "CHANGELOG.md has a $version section"
if grep -q "^## \[$version\] - unreleased" CHANGELOG.md; then
  echo "note: it is still dated 'unreleased'"
fi

echo "== crate contents (cargo package --list)"
list=$(cargo package --list 2>/dev/null)
echo "$list" | awk -F/ '{ print (NF > 1 ? $1 "/" : $0) }' | sort | uniq -c
echo "$(echo "$list" | wc -l) files"

echo "== cargo publish --dry-run"
cargo publish --dry-run 2>&1 | grep -Ev 'File system loop|warning: ignoring (test|example)|Compiling|Updating'

echo "== AUR PKGBUILDs"
for dir in packaging/aur/*/; do
  pkgver=$(sed -n 's/^pkgver=//p' "$dir/PKGBUILD")
  [ "$pkgver" = "$version" ] || echo "note: ${dir}PKGBUILD is at $pkgver, Cargo.toml at $version"
  if command -v makepkg >/dev/null; then
    (cd "$dir" && makepkg --printsrcinfo | cmp -s - .SRCINFO) \
      || echo "note: ${dir}.SRCINFO is stale: mise run aur-srcinfo"
  fi
  if command -v namcap >/dev/null; then
    namcap "${dir}PKGBUILD"
  fi
done
command -v namcap >/dev/null || echo "namcap not installed (pacman -S namcap): skipped"
'''

[tasks.aur-srcinfo]
description = "Regenerate the AUR .SRCINFO files from the PKGBUILDs"
run = '''
set -euo pipefail
for dir in packaging/aur/*/; do
  (cd "$dir" && makepkg --printsrcinfo > .SRCINFO)
  echo "wrote ${dir}.SRCINFO"
done
'''

[tasks.aur-test]
description = "makepkg the source PKGBUILD from a tarball of HEAD (tests included), then namcap it"
run = '''
set -euo pipefail
version=$(sed -n 's/^pkgver=//p' packaging/aur/plugii/PKGBUILD)
dir=$(mktemp -d "${TMPDIR:-/tmp}/plugii-aur.XXXXXX")
git archive --format=tar.gz --prefix="plugii-$version/" -o "$dir/plugii-$version.tar.gz" HEAD
sed 's|^source=.*|source=("$pkgname-$pkgver.tar.gz")|' packaging/aur/plugii/PKGBUILD > "$dir/PKGBUILD"
(cd "$dir" && makepkg -f --cleanbuild)
if command -v namcap >/dev/null; then
  namcap "$dir/PKGBUILD" "$dir"/plugii-*.pkg.tar.zst
else
  echo "namcap not installed (pacman -S namcap): skipped"
fi
echo "built in $dir"
'''

[tasks.release-tag]
description = "Tag v<version> on main once it matches GitHub main, and push the tag (retries for the security key)"
run = '''
set -euo pipefail
[ "$(git branch --show-current)" = main ] || { echo "not on main"; exit 1; }
[ -z "$(git status --porcelain)" ] || { echo "working tree not clean"; exit 1; }
version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
tag="v$version"
.github/scripts/changelog-section.sh "$version" >/dev/null
if grep -q "^## \[$version\] - unreleased" CHANGELOG.md; then
  echo "CHANGELOG.md: date the $version section first"; exit 1
fi
if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
  echo "$tag already exists"; exit 1
fi
push() {
  for i in 1 2 3; do
    git push origin "$@" && return 0
    echo "push failed (touch the security key?), retry $i/3"
  done
  return 1
}
git fetch -q origin main
[ "$(git rev-parse main)" = "$(git rev-parse origin/main)" ] || {
  echo "local main isn't GitHub main: merge the release PR, then pull"; exit 1
}
git tag -a "$tag" -m "plugii $version"
push "refs/tags/$tag"
echo "pushed $tag: the Release workflow builds and publishes it"
'''
