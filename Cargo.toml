[package]
name = "plugii"
version = "0.1.0"
edition = "2024"
description = "Live Linux USB port monitor: which socket, what link speed, USB-C / PD power"
license = "MIT"
repository = "https://github.com/rdlu/plugii"
readme = "README.md"
keywords = ["usb", "usb-c", "linux", "sysfs", "tui"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
libc = "0.2.190"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["local-offset"] }
udev = "0.9.3"

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"
