name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches Cargo.toml's version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG doesn't match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG.md has a section for it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          .github/scripts/changelog-section.sh "$VERSION" > notes.md
          cat notes.md

  build:
    name: Build ${{ matrix.target }}
    needs: check
    strategy:
      matrix:
        include:
          # The oldest supported runners, so the binaries need glibc 2.35+ only.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo build --locked --release --target "$TARGET"
      - name: Package
        run: |
          name="plugii-$VERSION-$TARGET"
          bin="target/$TARGET/release/plugii"
          mkdir -p "dist/$name/completions" "dist/$name/man"
          cp "$bin" README.md LICENSE CHANGELOG.md "dist/$name/"
          "$bin" manpages "dist/$name/man"
          "$bin" completions bash > "dist/$name/completions/plugii.bash"
          "$bin" completions zsh > "dist/$name/completions/_plugii"
          "$bin" completions fish > "dist/$name/completions/plugii.fish"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          rm -r "$name"
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          .github/scripts/changelog-section.sh "$VERSION" > notes.md
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "plugii $VERSION" \
            --notes-file notes.md
