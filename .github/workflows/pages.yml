name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/tui/keys.rs'
      - 'tests/snapshots/**'
      - 'mise.toml'
      - '.github/workflows/pages.yml'
      - '.github/scripts/install-hugo.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued one waits rather than cancelling a
# deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The only download: the site itself builds offline (theme and
      # FlexSearch are vendored).
      - run: .github/scripts/install-hugo.sh "$RUNNER_TEMP/hugo"
      - run: hugo --minify
        working-directory: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
