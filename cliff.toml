# git-cliff: drafts CHANGELOG.md's next section from the commits since the
# last tag (mise run changelog). The draft is a starting point to edit in the
# release PR, not the final notes.
#
# Commits here are plain imperative sentences, so they're grouped by their
# first word. The task only passes commits that touch the shipped code
# (src/, Cargo.toml, Cargo.lock): docs site, CI and packaging work stay out.

[changelog]
header = ""
# One section, Keep a Changelog style. Dependency bumps (Dependabot's
# chore(deps) PRs and the like) collapse into one "Updated dependencies" line.
body = """
{% set dep_bump = "^(chore\\(deps\\)|Update dependencies|Bump )" -%}
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% set_global deps = false -%}
{% for commit in commits -%}
{% if commit.message is matching(dep_bump) -%}
{% set_global deps = true -%}
{% else %}
- {{ commit.message | split(pat="\n") | first | trim }}
{%- endif -%}
{% endfor -%}
{% if deps %}
- Updated dependencies.
{%- endif %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The HTML comments only order the groups; striptags drops them.
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^Release ", skip = true },
  { message = "^(Satisfy clippy|Refactor)", skip = true },
  { message = "^(chore\\(deps\\)|Update dependencies|Bump )", group = "<!-- 1 -->Changed" },
  { message = "^(Add|Introduce|Support)", group = "<!-- 0 -->Added" },
  { message = "^Fix", group = "<!-- 2 -->Fixed" },
  { message = "^(Drop|Remove|Delete)", group = "<!-- 3 -->Removed" },
  { message = ".*", group = "<!-- 1 -->Changed" },
]
